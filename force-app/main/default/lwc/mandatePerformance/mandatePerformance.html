<template>
  <div class="page slds-p-around_medium">
    <header class="brand-header slds-p-around_medium slds-m-bottom_medium">
      <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
        <div>
          <p class="brand-kicker">Ninety One</p>
          <h1 class="slds-text-heading_medium">Mandate performance</h1>
        </div>
        <span class={statusClass}>{statusLabel}</span>
      </div>
    </header>

    <div class="slds-grid slds-wrap slds-gutters">
      <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
        <article class="slds-card slds-m-bottom_medium">
          <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
              <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                  <span class="slds-text-heading_small">{mandateName}</span>
                </h2>
              </div>
            </header>
          </div>
          <div class="slds-card__body slds-card__body_inner">
            <dl class="slds-list_horizontal slds-wrap highlights">
              <div class="slds-item slds-m-bottom_small slds-size_1-of-2">
                <dt class="slds-item_label slds-text-color_weak">Client</dt>
                <dd class="slds-item_detail">{clientName}</dd>
              </div>
              <div class="slds-item slds-m-bottom_small slds-size_1-of-2">
                <dt class="slds-item_label slds-text-color_weak">AUM</dt>
                <dd class="slds-item_detail">{aumDisplay}</dd>
              </div>
              <div class="slds-item slds-size_1-of-2">
                <dt class="slds-item_label slds-text-color_weak">Inception</dt>
                <dd class="slds-item_detail">{inceptionDate}</dd>
              </div>
            </dl>
          </div>
        </article>

        <article class="slds-card slds-m-bottom_medium">
          <div class="slds-card__header">
            <h2 class="slds-card__header-title slds-text-heading_small">Performance vs {benchmarkLabel}</h2>
          </div>
          <div class="slds-card__body">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col"><div class="slds-truncate">Period</div></th>
                  <th scope="col"><div class="slds-truncate">Portfolio %</div></th>
                  <th scope="col"><div class="slds-truncate">Benchmark %</div></th>
                  <th scope="col"><div class="slds-truncate">Active %</div></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={periods} for:item="row">
                  <tr key={row.key}>
                    <td>{row.label}</td>
                    <td>{row.portfolio}</td>
                    <td>{row.benchmark}</td>
                    <td class={row.activeCellClass}>{row.activeFormatted}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </article>

        <article class="slds-card">
          <div class="slds-card__header">
            <h2 class="slds-card__header-title slds-text-heading_small">Active return by period</h2>
          </div>
          <div class="slds-card__body slds-align_absolute-center">
            <svg width="360" height="120" aria-label="Active return bar chart">
              <line x1="20" y1="50" x2="340" y2="50" stroke="#c9c9c9" stroke-width="1"></line>
              <template for:each={chartBars} for:item="bar">
                <g key={bar.key}>
                  <rect
                    x={bar.x}
                    y={bar.y}
                    width="48"
                    height={bar.height}
                    fill={bar.fill}
                    rx="2"
                  ></rect>
                  <text x={bar.textX} y="105" text-anchor="middle" class="chart-label">{bar.label}</text>
                </g>
              </template>
            </svg>
          </div>
        </article>
      </div>

      <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
        <article class="slds-card slds-m-bottom_medium">
          <div class="slds-card__body slds-card__body_inner">
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Next review</h3>
            <p class="slds-text-body_regular">{nextReviewDate}</p>
          </div>
        </article>
        <article class="slds-card slds-m-bottom_medium">
          <div class="slds-card__body slds-card__body_inner">
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Relationship manager</h3>
            <p class="slds-text-body_regular">{relationshipManager}</p>
          </div>
        </article>
        <article class="slds-card">
          <div class="slds-card__body slds-card__body_inner">
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Next best action</h3>
            <p class="slds-text-body_regular">{nextBestAction}</p>
          </div>
        </article>
      </div>
    </div>
  </div>
</template>
