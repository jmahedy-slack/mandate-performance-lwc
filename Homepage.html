<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandate Performance — Westbrook Pension Fund</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Salesforce Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f3f3f3;
        color: #181818;
        line-height: 1.5;
      }
      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1rem 1.25rem 2rem;
      }
      .brand-header {
        background: #fff;
        border-left: 4px solid #60a5fa;
        border-radius: 0.25rem;
        box-shadow: 0 2px 2px rgba(0, 0, 0, 0.05);
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .brand-kicker {
        margin: 0 0 0.25rem;
        color: #60a5fa;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .status-chip {
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }
      .status-outperforming {
        background: #2e844a;
      }
      .status-underperforming {
        background: #c23934;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 900px) {
        .layout {
          grid-template-columns: 2fr 1fr;
        }
      }
      .card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 0.25rem;
        box-shadow: 0 2px 2px rgba(0, 0, 0, 0.04);
        margin-bottom: 1rem;
      }
      .card-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e5e5e5;
        font-weight: 700;
        font-size: 0.9375rem;
      }
      .card-body {
        padding: 1rem;
      }
      .highlights {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem 1rem;
      }
      .highlights dt {
        margin: 0;
        font-size: 0.75rem;
        color: #706e6b;
      }
      .highlights dd {
        margin: 0.125rem 0 0;
        font-weight: 600;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th,
      td {
        border: 1px solid #e5e5e5;
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      th {
        background: #fafaf9;
        font-weight: 700;
      }
      .active-positive {
        color: #2e844a;
        font-weight: 600;
      }
      .active-negative {
        color: #c23934;
        font-weight: 600;
      }
      .chart-wrap {
        display: flex;
        justify-content: center;
        padding: 0.5rem 0 0.25rem;
      }
      .chart-label {
        fill: #444;
        font-size: 11px;
      }
      .sidebar h3 {
        margin: 0 0 0.35rem;
        font-size: 0.9375rem;
      }
      .sidebar p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="page" id="root"></div>
    <script type="module">
      const SAMPLE_PERIODS = [
        { key: "3M", label: "3M", portfolio: 2.1, benchmark: 1.8 },
        { key: "1Y", label: "1Y", portfolio: 8.4, benchmark: 6.9 },
        { key: "3Y", label: "3Y (ann.)", portfolio: 5.2, benchmark: 5.6 },
        { key: "5Y", label: "5Y (ann.)", portfolio: 7.1, benchmark: 6.3 },
      ];

      const mandate = {
        name: "Westbrook Pension Fund — Global Equity",
        client: "Westbrook Pension Trustees",
        aumPounds: 1250000000,
        inception: "01/03/2019",
        benchmarkName: "MSCI ACWI",
        nextReviewDate: "15/11/2026",
        relationshipManager: "Elena Voss",
      };

      function calcActive(portfolioPct, benchmarkPct) {
        return portfolioPct - benchmarkPct;
      }

      function formatActive(active) {
        const rounded = Math.round(active * 10) / 10;
        const sign = rounded >= 0 ? "+" : "−";
        return `${sign}${Math.abs(rounded).toFixed(1)}%`;
      }

      function getPerformanceStatus(oneYearActive) {
        return oneYearActive >= 0 ? "Outperforming" : "Underperforming";
      }

      function getNextBestAction(oneYearActive) {
        if (oneYearActive >= 1.0) return "Share outperformance story at review";
        if (oneYearActive >= 0) return "Reconfirm mandate objectives";
        return "Prepare performance attribution pack";
      }

      function formatAum(pounds) {
        const billions = pounds / 1000000000;
        const text = billions.toFixed(2).replace(/\.?0+$/, "");
        return `£${text}bn`;
      }

      const periods = SAMPLE_PERIODS.map((row) => {
        const active = calcActive(row.portfolio, row.benchmark);
        return {
          ...row,
          active,
          activeFormatted: formatActive(active),
          activeClass: active >= 0 ? "active-positive" : "active-negative",
          barFill: active >= 0 ? "#2e844a" : "#c23934",
        };
      });

      const oneYearActive = periods.find((p) => p.key === "1Y").active;
      const statusLabel = getPerformanceStatus(oneYearActive);
      const statusClass =
        oneYearActive >= 0 ? "status-outperforming" : "status-underperforming";

      const maxAbs = Math.max(...periods.map((p) => Math.abs(p.active)), 0.1);
      const scale = 40 / maxAbs;
      const baseX = 44;
      const step = 76;

      const bars = periods
        .map((p, index) => {
          const height = Math.abs(p.active) * scale;
          const isPositive = p.active >= 0;
          const x = baseX + index * step;
          const y = isPositive ? 50 - height : 50;
          return `<g>
            <rect x="${x}" y="${y}" width="48" height="${height}" fill="${p.barFill}" rx="2"></rect>
            <text x="${x + 24}" y="105" text-anchor="middle" class="chart-label">${p.label}</text>
          </g>`;
        })
        .join("");

      const tableRows = periods
        .map(
          (row) => `<tr>
          <td>${row.label}</td>
          <td>${row.portfolio}</td>
          <td>${row.benchmark}</td>
          <td class="${row.activeClass}">${row.activeFormatted}</td>
        </tr>`
        )
        .join("");

      document.getElementById("root").innerHTML = `
        <header class="brand-header">
          <div>
            <p class="brand-kicker">Ninety One</p>
            <h1>Mandate performance</h1>
          </div>
          <span class="status-chip ${statusClass}">${statusLabel}</span>
        </header>
        <div class="layout">
          <main>
            <article class="card">
              <div class="card-header">${mandate.name}</div>
              <div class="card-body">
                <dl class="highlights">
                  <div><dt>Client</dt><dd>${mandate.client}</dd></div>
                  <div><dt>AUM</dt><dd>${formatAum(mandate.aumPounds)}</dd></div>
                  <div><dt>Inception</dt><dd>${mandate.inception}</dd></div>
                </dl>
              </div>
            </article>
            <article class="card">
              <div class="card-header">Performance vs ${mandate.benchmarkName}</div>
              <div class="card-body">
                <table>
                  <thead>
                    <tr>
                      <th>Period</th>
                      <th>Portfolio %</th>
                      <th>Benchmark %</th>
                      <th>Active %</th>
                    </tr>
                  </thead>
                  <tbody>${tableRows}</tbody>
                </table>
              </div>
            </article>
            <article class="card">
              <div class="card-header">Active return by period</div>
              <div class="card-body chart-wrap">
                <svg width="360" height="120" aria-label="Active return bar chart">
                  <line x1="20" y1="50" x2="340" y2="50" stroke="#c9c9c9" stroke-width="1"></line>
                  ${bars}
                </svg>
              </div>
            </article>
          </main>
          <aside class="sidebar">
            <article class="card">
              <div class="card-body">
                <h3>Next review</h3>
                <p>${mandate.nextReviewDate}</p>
              </div>
            </article>
            <article class="card">
              <div class="card-body">
                <h3>Relationship manager</h3>
                <p>${mandate.relationshipManager}</p>
              </div>
            </article>
            <article class="card">
              <div class="card-body">
                <h3>Next best action</h3>
                <p>${getNextBestAction(oneYearActive)}</p>
              </div>
            </article>
          </aside>
        </div>`;
    </script>
  </body>
</html>
