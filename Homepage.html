<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandate Performance — Westbrook Pension Fund</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Salesforce Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f3f3f3;
        color: #181818;
        line-height: 1.5;
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem 1.25rem 2.5rem;
      }
      .brand-header {
        border-left: 4px solid #60a5fa;
        padding-left: 0.75rem;
        margin-bottom: 1rem;
      }
      .brand-mark {
        font-size: 1.125rem;
        font-weight: 700;
        color: #032d60;
      }
      .brand-subtitle {
        font-size: 0.8125rem;
        color: #706e6b;
      }
      .slds-box {
        background: #fff;
        border: 1px solid #dddbda;
        border-radius: 0.25rem;
        box-shadow: 0 2px 2px rgba(0, 0, 0, 0.05);
      }
      .highlights {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
      }
      .mandate-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.25rem;
      }
      .client-name {
        margin: 0 0 0.75rem;
        color: #706e6b;
      }
      .meta-grid {
        display: flex;
        gap: 2rem;
      }
      .meta-grid dt {
        font-size: 0.75rem;
        color: #706e6b;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .meta-grid dd {
        margin: 0.125rem 0 0;
        font-weight: 600;
      }
      .status-chip {
        display: inline-block;
        padding: 0.25rem 0.625rem;
        border-radius: 0.75rem;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .status-chip.success {
        background: #2e844a;
        color: #fff;
      }
      .status-chip.error {
        background: #c23934;
        color: #fff;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 240px;
        gap: 1rem;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .card {
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
      }
      .section-title {
        font-size: 0.9375rem;
        font-weight: 700;
        margin: 0 0 0.75rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th,
      td {
        padding: 0.5rem 0.75rem;
        text-align: left;
        border-bottom: 1px solid #ecebea;
      }
      th {
        font-weight: 600;
        color: #706e6b;
        font-size: 0.75rem;
        text-transform: uppercase;
      }
      .active-cell {
        font-weight: 700;
        color: #032d60;
      }
      .active-chart {
        width: 100%;
        max-width: 320px;
        display: block;
        margin: 0 auto;
      }
      .zero-line {
        stroke: #c9c7c5;
        stroke-width: 1;
      }
      .bar-positive {
        fill: #2e844a;
      }
      .bar-negative {
        fill: #c23934;
      }
      .bar-label {
        font-size: 10px;
        fill: #706e6b;
        text-anchor: middle;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .side-card {
        padding: 0.875rem 1rem;
      }
      .side-card h3 {
        margin: 0 0 0.375rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #706e6b;
      }
      .side-value {
        margin: 0;
        font-weight: 600;
        font-size: 0.9375rem;
      }
      .action-card {
        border-left: 3px solid #60a5fa;
      }
      .action-text {
        margin: 0;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="page" id="app"></div>
    <script type="module">
      import {
        buildMandateViewModel,
        BENCHMARK_NAME,
      } from "./force-app/main/default/lwc/mandatePerformance/mandateCalc.js";

      const view = buildMandateViewModel();
      const maxAbs = Math.max(...view.performanceRows.map((r) => Math.abs(r.active)), 0.1);
      const scale = 40 / maxAbs;
      const baseY = 80;
      const startX = 48;
      const gap = 64;

      const barsSvg = view.performanceRows
        .map((row, index) => {
          const height = Math.max(4, Math.abs(row.active) * scale);
          const x = startX + index * gap;
          const y = row.barPositive ? baseY - height : baseY;
          const cls = row.barPositive ? "bar-positive" : "bar-negative";
          return `<g>
            <rect class="${cls}" x="${x}" y="${y}" width="36" height="${height}" rx="2"></rect>
            <text class="bar-label" x="${x + 18}" y="150">${row.label}</text>
          </g>`;
        })
        .join("");

      const tableRows = view.performanceRows
        .map(
          (row) => `<tr>
            <td>${row.label}</td>
            <td>${row.portfolio}%</td>
            <td>${row.benchmark}%</td>
            <td class="active-cell">${row.activeFormatted}</td>
          </tr>`
        )
        .join("");

      const statusClass = view.statusOutperforming ? "success" : "error";

      document.getElementById("app").innerHTML = `
        <header class="brand-header">
          <div class="brand-mark">Ninety One</div>
          <div class="brand-subtitle">Mandate performance</div>
        </header>

        <section class="highlights slds-box">
          <div>
            <h1 class="mandate-title">${view.name}</h1>
            <p class="client-name">${view.client}</p>
            <dl class="meta-grid">
              <div><dt>AUM</dt><dd>${view.aumFormatted}</dd></div>
              <div><dt>Inception</dt><dd>${view.inception}</dd></div>
            </dl>
          </div>
          <span class="status-chip ${statusClass}">${view.statusLabel}</span>
        </section>

        <div class="layout">
          <main>
            <section class="slds-box card">
              <h2 class="section-title">Performance vs ${BENCHMARK_NAME}</h2>
              <table>
                <thead>
                  <tr>
                    <th>Period</th>
                    <th>Portfolio %</th>
                    <th>Benchmark %</th>
                    <th>Active %</th>
                  </tr>
                </thead>
                <tbody>${tableRows}</tbody>
              </table>
            </section>
            <section class="slds-box card">
              <h2 class="section-title">Active return by period</h2>
              <svg class="active-chart" viewBox="0 0 320 160" role="img" aria-label="Active return bar chart">
                <line x1="24" y1="80" x2="296" y2="80" class="zero-line"></line>
                ${barsSvg}
              </svg>
            </section>
          </main>
          <aside class="sidebar">
            <article class="slds-box side-card">
              <h3>Next review</h3>
              <p class="side-value">${view.nextReview}</p>
            </article>
            <article class="slds-box side-card">
              <h3>Relationship manager</h3>
              <p class="side-value">${view.relationshipManager}</p>
            </article>
            <article class="slds-box side-card action-card">
              <h3>Next best action</h3>
              <p class="action-text">${view.nextBestAction}</p>
            </article>
          </aside>
        </div>`;
    </script>
  </body>
</html>
